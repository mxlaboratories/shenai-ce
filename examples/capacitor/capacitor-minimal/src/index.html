<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shen.AI (CE) Capacitor Minimal</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: transparent;
      }

      #status {
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 12px;
        padding: 10px 12px;
        color: #162033;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        font:
          14px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="status">Initializing SDK</div>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
